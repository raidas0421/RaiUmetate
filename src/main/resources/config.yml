# 直径は外壁を除く内側の一辺（奇数）。
default-diameter: 11
min-diameter: 3
max-diameter: 53
default-height: 9
min-height: 3
max-height: 36
default-boundary-material: GLASS
win:
  # Winの送り先。ste: Stream To Earn、rlc: Rai Live（下の rai-live.url。状態と合図も送ります）、none: 送らない
  sink: ste
  retry:
    max-attempts: 3
  ste:
    websocket-url: 'ws://127.0.0.1:50707'
    send-mode: burst
    send-interval-ms: 350
    connect-timeout-ms: 5000
    max-count-per-command: 1000
    max-queued-commands: 100
# Rai Live（win.sink: rlc のときに使用）。VPSではSSHの逆方向転送でつながる http://127.0.0.1:4180
rai-live:
  url: 'http://127.0.0.1:4180'
  # 枠HP・埋め立て率・2倍タイムを確かめる間隔（tick）。変化したときだけ送ります。
  state-interval-ticks: 5
win-seconds: 15
win-text: '埋め立て成功！'
cancel-text: '妨害発生！カウント中断'
win-color: GOLD
cancel-color: RED
autoreplace: true
fireworks: true
toplock: true
# 標準の層は上から各3段: ダイヤ・金・鉄・エメラルド・アメジスト・銅。19段目以降はクォーツ。
# 旧layers設定は使用しません。個別変更は /umetate layer で指定できます。
frame-health:
  save-interval-ticks: 40
  enabled: true
  max-health: 10000
  rebuild-delay-ticks: 100
  # 未使用（旧設定）。
  release-blocks-per-tick: 200
  # 枠HPが減るほど、枠のブロックにひび（掘るときと同じ見た目）を濃く入れます。
  cracks: true
  # 枠が壊れたときだけ、中身を全部、砂のように下の段から順に真下へ落とします。落ちたブロックは消さずにそのまま残ります。
  # 全部が着地してから rebuild-delay-ticks 後に枠を作り直します。（2.6.0で max-launch の上限は廃止）
  collapse:
    # 1tickに落とし始めるブロック数。
    launch-per-tick: 40
    # 同時に落ちている落下ブロックの上限（重くならないように待ちます）。
    max-flying: 600
bedrock-integration:
  valid-boundary-materials: [BEDROCK, GLASS, OAK_PLANKS, SPRUCE_PLANKS, BIRCH_PLANKS, JUNGLE_PLANKS, ACACIA_PLANKS, DARK_OAK_PLANKS, MANGROVE_PLANKS, CHERRY_PLANKS, BAMBOO_PLANKS, CRIMSON_PLANKS, WARPED_PLANKS]
# RaiBRから移植したOBS枠HP表示。必要な場合に有効化（RaiBR既定ポートと分離）。
obs-overlay:
  enabled: false
  bind-address: 127.0.0.1
  port: 17967
fountain:
  blocks-per-tick: 4
  # 連続発射に必要な blocks-per-tick × flight-ticks 以上へ自動補正します。
  max-displays: 120
  flight-ticks: 30
  arc-height: 6.0
performance:
  # true: fill・clear・wall・layer・作成・削除・サイズ変更・クリア後の掃除を、1tickあたり下の時間まで使って
  # 数tick（最大サイズで約0.1～0.15秒）で反映。false: max-work-ms-per-tick と changes-per-tick に従ってゆっくり反映。
  instant-box-changes: true
  instant-max-ms-per-tick: 20
  # 構造変更・事前検査・保存データ取得に使う1tickの時間予算（ms）。
  max-work-ms-per-tick: 2.0
  changes-per-tick: 1500
  # 外部からの変更を拾う整合性スキャン（保険）。通常の更新はイベントで即時反映されます。
  reconcile-per-tick: 64
effects:
  max-active: 100
  max-endermen: 30
  # 箱の中のTNTブロック（alltnt など）が連鎖点火するとき、80tick（導火線1本分）の間に点火を許す上限。
  # 超えた分は点火せずTNTブロックのまま残ります（あとで再び点火できます）。箱いっぱいのTNTが一斉に点火してサーバーが止まるのを防ぎます。
  max-chain-tnt: 100
  tnt-radius: 3.0
  meteor-radius: 8.0
  comet-radius: 2.5
  zeus-radius: 10.0
  blackhole-radius: 12.0
  # 埋め立て成功時に箱のまわりから花火を打ち上げる（約4秒）。
  win-fireworks: true
  # /umetate clear（全消し）でエンダードラゴンが箱の上を通過し、通ったところから中身を消す（約8秒。clear-dragon-seconds で変更）。
  # false で従来どおり即時に消す。/umetate clear 1 は常に即時、clear 2 は常にドラゴン。
  clear-dragon: true
  # エンダードラゴンが箱を通過しきるまでの秒数（3～60）。箱の大きさによらず、この時間で端から端まで飛びます。
  clear-dragon-seconds: 8
  # ドラゴンの向きの補正（度）。頭が進行方向の逆を向いて見えるときは 180 にします。
  clear-dragon-yaw-offset: 0
  # ai: ドラゴンのAIを有効にして飛ばす（クライアントで動きが見える。既定）。teleport: AIを切って位置だけ動かす旧方式（クライアントでは止まって見える）。
  clear-dragon-mode: ai
  # お助けアレイ（/umetate alley）の同時数上限。
  max-alleys: 20

# お助けアレイ。箱の空きマスを下の段から順に、層の素材（標準は石）で埋めます。
alley:
  blocks-per-second: 4

# 箱の周辺にいるプレイヤーのブロック操作距離（設置・破壊共通）。0で通常、最大64（Minecraft本体の属性の上限で、これを超える値は効きません）。
block-reach: 64

# 箱内の浮いたブロックを、その列の一番下の空きマスへ即座に移します（上に積まれた列もまとめて詰めます）。
gravity:
  # 重力の走査と移動に使う時間予算。超過分は次回へ繰り越し。
  max-work-ms-per-tick: 2.0
  enabled: true
  interval-ticks: 2
  scan-per-step: 2000
  blocks-per-step: 256

# RaiBRと同様に鮭の爆発でエンティティにもダメージを与える。
salmon:
  damage-entities: true

double-time:
  multiplier: 2
  max-multiplier: 10
  default-seconds: 30
  max-seconds: 3600
  stagger-ticks: 5
  excluded-effects: [prison, freeze]
  messages:
    bossbar: '妨害{倍率}倍タイム 残り {秒}秒'
    start-title: '妨害{倍率}倍タイム！'
    start-subtitle: '{秒}秒間、妨害が{倍率}倍になる'
    end-title: '妨害{倍率}倍タイム終了'
    end-subtitle: '元に戻りました'
  sound:
    start: ''
    end: ''

# ドパガチャ（/umetate dopa [名前]）。抽選はここで決め、結果を Rai Live へ合図 dia.dopa（unit=win）で送る（演出は Rai Live の /obs/dopa。win.sink が rlc のときだけ送る）
# 当たると、命中の瞬間に Win 数を −win-delta（WinService 経由。win.sink が rlc なら Rai Live の /api/wins、source は RaiUmetate）。
# 仕組みはパルクール・タワーディフェンスの dopa: と同じ。当たりの見せ方: 普通 / 先バレ（最初から虹）/ フリーズ（途中で止まって虹）/ 復活（煙のあとで急に始まる）。
# 各色の期待度（その色の演出が出たときの当たりやすさ）: 青 10% / 緑 30% / 赤 80% / 虹 100%。演出が出るのは全体の約 3.5%（約 29 回に 1 回）。
# 確率の表示は /umetate dopa info、抽選だけの試しは /umetate dopa sim [回数] [当たり率]（Win は減らさない）。設定の反映はサーバー再起動
dopa:
  # 使う演出（空にするとドパガチャが止まる）
  enabled-reaches: [wither, tnt, ghast, ore, reel, creeper, warden]
  # どの演出を出すかの重み（0 にするとその演出は出ない）
  reach-weights:
    wither: 1
    tnt: 1
    ghast: 1
    dragon: 0
    ore: 1
    reel: 1
    creeper: 1
    warden: 1
  # 当たる確率（固定）。1/100 のように分数でも、0.01 のような数字でも書ける
  win-chance: 0.01
  # 当たったときの Win −N
  win-delta: 7
  # 当たりの見せ方の重み（普通 先バレ フリーズ 復活）。先バレ・フリーズは必ず虹で終わる
  win-kind-weights: [7, 1, 1, 1]
  # 普通・復活の最後の色の重み（青 緑 赤 虹）
  win-color-weights: [8, 10, 12, 2]
  # 色が上がっていく演出で、最初からその色で始める割合。残りは青から上がっていく
  start-final-rate: 0.5
  # 演出つきハズレの色の重み（青 緑 赤 虹）。虹は 0。青・緑は短い演出、赤はリーチ
  lose-color-weights: [73, 24, 3, 0]
  # 演出ごとのハズレの重み（数は演出ごとに決まっている: wither 3 / tnt 3 / ghast 3 / dragon 2 / ore 2 / reel 2 / creeper 3 / warden 3）
  reach-lose-weights:
    wither: [1, 1, 1]
    tnt: [1, 1, 1]
    ghast: [1, 1, 1]
    dragon: [1, 1]
    ore: [1, 1]
    reel: [1, 1]
    creeper: [1, 1, 1]
    warden: [1, 1, 1]
  # ハズレのうち、画面の下に煙と音だけ出す「ふつうのハズレ」にする割合。残りが演出つきのハズレ
  smoke-rate: 0.975
  # 命中の瞬間に全員へ出すタイトル（&色コード。{n} は Win の減る数）
  hit-title: '&6&lドパガチャ当たり！'
  hit-subtitle: '&cWin −{n}'
