<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RaiBR 枠耐久値</title>
  <style>
    :root { --accent:#63d34f; --accent-dark:#23852c; --damage:#ff4b3e; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:transparent; }
    body { display:flex; align-items:flex-start; justify-content:center; padding:18px; color:#fff; font-family:"MS Gothic","Yu Gothic UI","Courier New",monospace; }
    #overlay { width:min(94vw,680px); position:relative; filter:drop-shadow(0 8px 3px rgba(0,0,0,.46)); transform-origin:center top; }
    .stone {
      position:relative; padding:16px 19px 15px;
      background:
        linear-gradient(90deg,transparent 49%,rgba(255,255,255,.09) 50%,transparent 51%) 0 0/96px 32px,
        linear-gradient(rgba(255,255,255,.07) 49%,rgba(0,0,0,.18) 50%,transparent 54%) 0 0/100% 32px,
        #686868;
      border:6px solid #252525;
      box-shadow:inset 0 0 0 4px #9a9a9a,inset 0 0 0 8px #4a4a4a;
      clip-path:polygon(8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,100% 4px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px),0 8px,8px 8px);
    }
    .header { display:flex; align-items:end; justify-content:space-between; gap:16px; padding:3px 8px 8px; text-shadow:3px 3px 0 #202020; }
    .label { font-size:30px; font-weight:900; letter-spacing:.12em; white-space:nowrap; }
    .shield { color:#80e978; margin-right:7px; }
    .numbers { font-size:29px; font-weight:900; letter-spacing:.04em; white-space:nowrap; }
    .meter-frame { height:39px; padding:6px; background:#171717; border:4px solid #0b0b0b; box-shadow:inset 0 0 0 2px #424242,0 3px 0 #303030; }
    .meter { position:relative; width:100%; height:100%; overflow:hidden; background:#2a1616; }
    #fill { height:100%; width:100%; background:repeating-linear-gradient(90deg,var(--accent) 0 26px,var(--accent-dark) 26px 30px); transition:width .42s cubic-bezier(.2,.8,.2,1),background-color .3s; box-shadow:inset 0 4px rgba(255,255,255,.22),inset 0 -4px rgba(0,0,0,.22); }
    .message { margin:10px 7px 0; min-height:32px; display:flex; justify-content:center; align-items:center; color:#ffe367; font-size:24px; font-weight:900; text-align:center; letter-spacing:.04em; text-shadow:3px 3px 0 #2b1c00; }
    #damage { position:absolute; z-index:3; right:28px; top:52px; color:#ff6a5e; font-size:33px; font-weight:900; opacity:0; text-shadow:3px 3px 0 #3c0000; pointer-events:none; }
    #damage.pop { animation:damage-pop 1.15s steps(8,end); }
    #overlay.hit { animation:hit-shake .38s steps(5,end); }
    #overlay.danger .stone { box-shadow:inset 0 0 0 4px #d08a5e,inset 0 0 0 8px #5b2621,0 0 18px rgba(255,55,35,.48); }
    #overlay.danger .message { color:#ff5448; animation:warning .55s steps(2,end) infinite; }
    #overlay.rebuilding .stone { filter:saturate(.25); }
    #overlay.rebuilding #fill { width:100%!important; background:repeating-linear-gradient(135deg,#b9b9b9 0 14px,#737373 14px 28px); animation:rebuild 1.1s linear infinite; background-size:40px 40px; }
    #overlay.waiting { opacity:.72; }
    @keyframes damage-pop { 0%{opacity:0;transform:translateY(12px) scale(.7)} 12%,60%{opacity:1;transform:translateY(0) scale(1.14)} 100%{opacity:0;transform:translateY(-22px) scale(.95)} }
    @keyframes hit-shake { 0%,100%{transform:translate(0)} 20%{transform:translate(-9px,3px)} 40%{transform:translate(8px,-2px)} 60%{transform:translate(-5px,-1px)} 80%{transform:translate(4px,2px)} }
    @keyframes warning { 50%{filter:brightness(1.7)} }
    @keyframes rebuild { to{background-position:40px 0} }
  </style>
</head>
<body>
  <main id="overlay" aria-live="polite">
    <div id="damage">-0</div>
    <section class="stone">
      <div class="header">
        <div class="label"><span class="shield">◆</span>耐久値</div>
        <div class="numbers"><span id="hp">10,000</span> / <span id="max">10,000</span></div>
      </div>
      <div class="meter-frame"><div class="meter"><div id="fill"></div></div></div>
      <div id="double-time" style="display:none;color:#e7aaff;text-align:center;font-weight:bold"></div>
      <div id="message" class="message">TNTで枠を壊さないで！</div>
    </section>
  </main>
  <script>
    const overlay=document.getElementById('overlay'),hp=document.getElementById('hp'),max=document.getElementById('max');
    const fill=document.getElementById('fill'),message=document.getElementById('message'),damage=document.getElementById('damage');
    const number=new Intl.NumberFormat('ja-JP',{maximumFractionDigits:0}); let revision=-1;
    function animateDamage(amount){
      damage.textContent='-'+number.format(Math.max(1,Math.ceil(amount)));damage.classList.remove('pop');overlay.classList.remove('hit');
      void damage.offsetWidth;damage.classList.add('pop');overlay.classList.add('hit');
    }
    function render(state){
      const dt=state.doubleTime, badge=document.getElementById('double-time');badge.style.display=dt&&dt.active?'block':'none';if(dt&&dt.active)badge.textContent='妨害'+dt.multiplier+'倍 残り'+dt.remainingSeconds+'秒';
      const maximum=Math.max(1,state.maximum||10000),health=Math.max(0,Math.min(maximum,state.health||0)),ratio=health/maximum;
      hp.textContent=number.format(Math.ceil(health));max.textContent=number.format(Math.ceil(maximum));fill.style.width=(ratio*100)+'%';
      overlay.className='';
      if(state.status==='waiting'){overlay.classList.add('waiting');message.textContent='枠を作成すると耐久値が表示されます';fill.style.width='0%';}
      else if(state.status==='rebuilding'){overlay.classList.add('rebuilding');message.textContent='枠を再生成中…';}
      else if(ratio<=.1){overlay.classList.add('danger');message.textContent='⚠ TNTを止めて！ 枠が壊れる！';}
      else if(ratio<=.3){overlay.classList.add('danger');message.textContent='⚠ 枠が壊れそう！ TNTを止めて！';}
      else {message.textContent='TNTで枠を壊さないで！';}
      const hue=ratio>.5?['#63d34f','#23852c']:ratio>.2?['#ffd447','#b0780c']:['#ff5548','#9c1717'];
      document.documentElement.style.setProperty('--accent',hue[0]);document.documentElement.style.setProperty('--accent-dark',hue[1]);
      if(revision>=0&&state.revision!==revision&&state.lastDamage>0)animateDamage(state.lastDamage);revision=state.revision;
    }
    async function update(){try{const response=await fetch('/state',{cache:'no-store'});if(response.ok)render(await response.json());}catch{message.textContent='RaiBRとの接続を待っています…';}}
    update();setInterval(update,250);
  </script>
</body>
</html>
